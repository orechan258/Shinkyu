<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>管理者画面 - 在宅勤務申請システム</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	
<div th:replace="~{common :: menu}"></div>
<script th:replace="~{common :: menuScript}"></script>
    
    <h1>管理者画面</h1>
    
    <div class="button-container">
        <a th:href="@{/admin/users}" class="main-button" style="background-color: #27ae60;">ユーザーマスタ管理</a>

        <a th:href="@{/admin/roles}" class="main-button">権限管理画面</a>
        
        <a th:href="@{/admin/applications}" class="main-button">プロフィール変更申請の管理</a> 
        
        <a th:href="@{/admin/csv-export}" class="main-button">CSV出力</a>
    </div>
    
    <a th:href="@{/home}" class="back-button">ホーム画面へ戻る</a>

    <script>
	    function toggleMenu() {
	        const menu = document.getElementById('menuPanel');
	        menu.classList.toggle('open');
	    }
	</script>
    
</body>
</html>
