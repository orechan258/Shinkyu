<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head></head>

<body>
    <nav th:fragment="menu" class="sidebar">
        <!-- Bootstrap Icons CDN (各ページでheaderに入っていない場合のバックアップとしてここに配置) -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

        <div class="sidebar-header">
            リモートワーク申請
        </div>
        <nav>
            <a th:href="@{/home}">ホーム</a>
            <a th:href="@{/request}" sec:authorize="isAuthenticated()">申請画面</a>
            <a th:href="@{/check}" sec:authorize="isAuthenticated()">申請確認画面</a>
            <a th:href="@{/approve}" sec:authorize="hasAnyRole('APPROVER', 'ADMIN')">承認画面</a>

            <!-- 管理者メニュー (分割ボタン) -->
            <div sec:authorize="hasRole('ADMIN')" class="admin-menu-wrapper">
                <div class="admin-split-btn">
                    <a th:href="@{/admin}" class="admin-main-link">管理者画面</a>
                    <button class="dropdown-toggle-btn" onclick="toggleDropdown()">
                        <i id="dropdownIcon" class="bi bi-chevron-down"></i>
                    </button>
                </div>
                <div id="dropdownContainer" class="dropdown-container">
                    <a th:href="@{/admin/users}">ユーザーマスタ管理</a>
                    <a th:href="@{/admin/roles}">権限管理画面</a>
                    <a th:href="@{/admin/applications}">プロフィール変更申請の管理</a>
                    <a th:href="@{/admin/export}" data-bs-toggle="modal" data-bs-target="#filterModal">
                        CSV出力
                    </a>

                </div>
            </div>

            <a th:href="@{/profile}" sec:authorize="isAuthenticated()">プロフィール</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">ログアウト</button>
            </form>
        </div>
    </nav>

    <!-- サイドバーがあるページでのみbodyにクラスを付与してレイアウト調整 -->
    <script th:fragment="menuScript">
        document.body.classList.add('has-sidebar');

        // 現在のURLに基づいてアクティブなリンクをハイライト
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            const links = document.querySelectorAll('.sidebar nav a');

            links.forEach(link => {
                const href = link.getAttribute('href');
                if (!href) return;

                // ホームは完全一致、それ以外は前方一致（サブパス含む）で判定
                let isActive = false;
                if (href === '/home') {
                    if (currentPath === '/home') isActive = true;
                } else {
                    const pathOnly = currentPath.split('?')[0];
                    if (pathOnly.startsWith(href)) isActive = true;
                }

                if (isActive) {
                    link.classList.add('active');

                    // ドロップダウン内のリンクなら親コンテナを開き、アイコンを回転
                    const container = link.closest('.dropdown-container');
                    if (container) {
                        container.classList.add('show');
                        const icon = document.getElementById('dropdownIcon');
                        if (icon) icon.style.transform = "rotate(180deg)";
                    }
                }
            });
        });

        // ドロップダウン切り替え機能
        function toggleDropdown() {
            var container = document.getElementById("dropdownContainer");
            var icon = document.getElementById("dropdownIcon");

            container.classList.toggle("show");

            if (container.classList.contains("show")) {
                icon.style.transform = "rotate(180deg)";
            } else {
                icon.style.transform = "rotate(0deg)";
            }
        }
        function toggleMenu() {
            const menu = document.getElementById('menuPanel');
            menu.classList.toggle('open');
        }


        document.addEventListener('DOMContentLoaded', function () {

            // 部署 → グループ
            document.querySelectorAll('.dept-checkbox').forEach(deptCheckbox => {
                deptCheckbox.addEventListener('change', function () {
                    const deptId = this.dataset.deptId;

                    document.querySelectorAll(
                        '.group-checkbox[data-parent-dept="' + deptId + '"]'
                    ).forEach(groupCheckbox => {
                        groupCheckbox.checked = this.checked;
                    });
                });
            });

            // グループ → 部署
            document.querySelectorAll('.group-checkbox').forEach(groupCheckbox => {
                groupCheckbox.addEventListener('change', function () {
                    const deptId = this.dataset.parentDept;

                    const groups = document.querySelectorAll(
                        '.group-checkbox[data-parent-dept="' + deptId + '"]'
                    );

                    const deptCheckbox = document.querySelector(
                        '.dept-checkbox[data-dept-id="' + deptId + '"]'
                    );

                    deptCheckbox.checked = Array.from(groups).some(cb => cb.checked);
                });
            });

            // ✅ 全部署を一括選択
            document.getElementById('selectAllDepartments').addEventListener('click', function () {

                // 部署すべてON
                document.querySelectorAll('.dept-checkbox').forEach(deptCheckbox => {
                    deptCheckbox.checked = true;
                });

                // グループすべてON
                document.querySelectorAll('.group-checkbox').forEach(groupCheckbox => {
                    groupCheckbox.checked = true;
                });
            });

            // 全選択解除
            document.getElementById('clearFilters').addEventListener('click', function () {
                document.querySelectorAll('.dept-checkbox, .group-checkbox')
                    .forEach(cb => cb.checked = false);
            });

        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
