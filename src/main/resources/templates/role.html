<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>権限管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ... スタイル省略 ... */
        table { width: 80%; margin: 20px auto; border-collapse: collapse; }
        .search-indicator {
            width: 80%;
            text-align: right;
            color: #888888;
            font-size: 0.9em;
            padding-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>ユーザー権限管理</h1>

        <form method="get" th:action="@{/admin/roles}" class="mb-4">
            <div class="input-group" style="width: 350px;">
                <input type="text" class="form-control" placeholder="IDまたは氏名で検索" 
                       name="search" th:value="${searchQuery}" />
                <button class="btn btn-primary" type="submit">検索</button>
            </div>
        </form>
        <div class="search-indicator" 
             th:if="${searchQuery != null and searchQuery.length() > 0}">
            <span th:text="|'${searchQuery}' の検索結果|"></span>
        </div>

        <form th:action="@{/admin/roles/save}" method="post">
        
            <table class="table table-bordered">
                <thead>
                    <tr class="table-secondary">
                        <th>ユーザーID</th>
                        <th>氏名</th>
                        <th>承認者</th>
                        <th>管理者</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${list}">
                        <td th:text="${user.userId}">user001</td>
                        <td th:text="${user.lastName} + ' ' + ${user.firstName}">山田 太郎</td>
                        
                        <td>
                            <div class="form-check form-switch">
                                <input type="checkbox" class="form-check-input" 
                                       th:id="|approverSwitch-${user.userId}|"
                                       name="approverStatus"
                                       th:value="${user.userId}"
                                       th:checked="${user.isApprover}" />
                                
                                <label class="form-check-label" th:for="|approverSwitch-${user.userId}|" 
                                       th:text="${user.isApprover ? '承認者' : '一般'}"></label>
                            </div>
                        </td>
                        
                        <td>
                            <div class="form-check form-switch">
                                <input type="checkbox" class="form-check-input" 
                                       th:id="|adminSwitch-${user.userId}|"
                                       name="adminStatus"
                                       th:value="${user.userId}"
                                       onclick="openConfirmModal(this.form.id, this.checked, this)" 
                                       th:checked="${user.isAdmin}" />

                                <label class="form-check-label" th:for="|adminSwitch-${user.userId}|"
                                       th:text="${user.isAdmin ? '管理者' : '一般'}"></label>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <button type="submit" class="btn btn-success mt-3 me-3">変更を保存</button>
            
        </form>
        <p><a th:href="@{/admin}">管理者ホームに戻る</a></p>
    </div>

    </body>
</html>
