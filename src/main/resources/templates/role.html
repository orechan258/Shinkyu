<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>権限管理</title>
	<link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<style>
		table {
			width: 95%;
			margin: 20px auto;
			border-collapse: collapse;
		}

		.table-container {
			max-height: 70vh;
			overflow-y: auto;
			width: 95%;
			margin: auto;
		}

		th,
		td {
			border: 1px solid #dee2e6;
			padding: 10px;
			text-align: left;
			vertical-align: middle;
			font-size: 0.9em;
		}

		.pagination-controls {
			margin-top: 15px;
			margin-bottom: 20px;
		}

		.btn {
			white-space: nowrap;
		}

		.sticky-top {
			top: 0;
			z-index: 10;
			background: white;
		}
	</style>
</head>

<body>

	<div th:replace="~{common :: menu}"></div>
	<script th:replace="~{common :: menuScript}"></script>
	</div>
	<div class="container mt-4" style="max-width: 1200px;">
		<h1>ユーザー権限管理</h1>

		<div class="card mb-4 border-0 bg-transparent search-panel">
			<form method="get" th:action="@{/admin/roles}" id="searchForm">
				<div class="d-flex align-items-center mb-3">
					<div class="input-group me-3" style="width: 350px;">
						<span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
						<input type="text" class="form-control" name="search" th:value="${searchQuery}"
							placeholder="IDまたは氏名で検索" />
						<button class="btn btn-primary" type="submit">検索</button>
					</div>

					<button type="button" class="btn btn-outline-dark" data-bs-toggle="modal"
						data-bs-target="#filterModal">
						<i class="bi bi-funnel"></i> 部署・グループ絞り込み
						<span th:if="${selectedGroupIds != null and !selectedGroupIds.isEmpty()}"
							class="badge bg-primary" th:text="${selectedGroupIds.size()}">0</span>
					</button>

					<a th:if="${(searchQuery != null and searchQuery != '') or (selectedGroupIds != null and !selectedGroupIds.isEmpty())}"
						th:href="@{/admin/roles(search='', groupIds='')}" class="btn btn-outline-secondary btn-sm ms-2">
						<i class="bi bi-x-circle"></i> フィルターをリセット
					</a>
				</div>

				<div class="modal fade" id="filterModal" tabindex="-1">
					<div class="modal-dialog modal-lg">
						<div class="modal-content">
							<div class="modal-header bg-light">
								<h5 class="modal-title">所属で絞り込み（複数選択可）</h5>
								<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
							</div>
							<div class="modal-body">
								<div class="row">
									<div th:each="dept : ${allDepartments}" class="col-md-6 mb-4">
										<div class="card h-100 shadow-sm">
											<div class="card-header py-2 d-flex align-items-center bg-white">
												<input type="checkbox" class="form-check-input dept-checkbox me-2"
													th:id="'dept-' + ${dept.id}" th:data-dept-id="${dept.id}">
												<label class="form-check-label fw-bold" th:for="'dept-' + ${dept.id}"
													th:text="${dept.name}"></label>
											</div>
											<div class="card-body py-2">
												<div th:each="group : ${allGroups}"
													th:if="${group.department.id == dept.id}" class="form-check ms-3">
													<input type="checkbox" name="groupIds"
														class="form-check-input group-checkbox"
														th:data-parent-dept="${dept.id}" th:value="${group.id}"
														th:id="'group-' + ${group.id}"
														th:checked="${selectedGroupIds != null and selectedGroupIds.contains(group.id)}">
													<label class="form-check-label" th:for="'group-' + ${group.id}"
														th:text="${group.groupName}"></label>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="modal-footer">
								<button type="button" class="btn btn-secondary" id="clearFilters">全選択解除</button>
								<button type="submit" class="btn btn-primary px-5">適用する</button>
							</div>
						</div>
					</div>
				</div>
			</form>
		</div>

		<form id="roleSaveForm" th:action="@{/admin/roles/save}" method="post">
			<input type="hidden" name="search" th:value="${searchQuery}" />
			<th:block th:each="id : ${selectedGroupIds}">
				<input type="hidden" name="groupIds" th:value="${id}" />
			</th:block>

			<div class="d-flex justify-content-between align-items-center mb-3">
				<div>
					<small class="text-muted" th:if="${userPage.totalElements > 0}"
						th:text="|全 ${userPage.totalElements} 件中 ${userPage.number * userPage.size + 1}～${userPage.number * userPage.size + userPage.numberOfElements} 件を表示|"></small>
				</div>
				<div>
					<button type="submit" class="btn btn-success me-2">権限の変更を一括保存</button>
					<a th:href="@{/admin}" class="btn btn-secondary">戻る</a>
				</div>
			</div>

			<nav th:if="${userPage.totalPages > 1}" class="d-flex justify-content-center pagination-controls">
				<ul class="pagination">
					<li class="page-item" th:classappend="${userPage.first ? 'disabled' : ''}">
						<a class="page-link"
							th:href="@{/admin/roles(page=0, search=${searchQuery}, groupIds=${selectedGroupIds})}">&laquo;</a>
					</li>
					<th:block th:each="i : ${#numbers.sequence(startPageForLoop, endPageForLoop)}">
						<li class="page-item" th:classappend="${i == userPage.number ? 'active' : ''}">
							<a class="page-link"
								th:href="@{/admin/roles(page=${i}, search=${searchQuery}, groupIds=${selectedGroupIds})}"
								th:text="${i + 1}"></a>
						</li>
					</th:block>
					<li class="page-item" th:classappend="${userPage.last ? 'disabled' : ''}">
						<a class="page-link"
							th:href="@{/admin/roles(page=${userPage.totalPages - 1}, search=${searchQuery}, groupIds=${selectedGroupIds})}">&raquo;</a>
					</li>
				</ul>
			</nav>

			<div class="table-container shadow-sm border rounded">
				<table class="table table-bordered table-hover mb-0">
					<thead>
						<tr class="table-secondary sticky-top">
							<th>ユーザーID</th>
							<th>氏名</th>
							<th>部署</th>
							<th>所属グループ</th>
							<th>承認者</th>
							<th>管理者</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="user : ${userPage.content}">
							<td th:text="${user.userId}"></td>
							<td th:text="${user.lastName} + ' ' + ${user.firstName}"></td>
							<td th:text="${user.departmentName}"></td>
							<td th:text="${user.groupName}"></td>
							<td>
								<div class="form-check form-switch">
									<input type="checkbox" class="form-check-input" th:id="'app-' + ${user.userId}"
										name="approverStatus" th:value="${user.userId}" th:checked="${user.approver}" />
									<label class="form-check-label" th:for="'app-' + ${user.userId}"
										th:text="${user.approver ? '承認者' : '一般'}"></label>
								</div>
							</td>
							<td>
								<div class="form-check form-switch">
									<input type="checkbox" class="form-check-input" th:id="'adm-' + ${user.userId}"
										name="adminStatus" th:value="${user.userId}" th:checked="${user.admin}" />
									<label class="form-check-label" th:for="'adm-' + ${user.userId}"
										th:text="${user.admin ? '管理者' : '一般'}"></label>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</form>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			// 部署チェックボックス連動
			document.querySelectorAll('.dept-checkbox').forEach(deptBox => {
				deptBox.addEventListener('change', function () {
					const deptId = this.getAttribute('data-dept-id');
					document.querySelectorAll(`.group-checkbox[data-parent-dept="${deptId}"]`).forEach(groupBox => {
						groupBox.checked = this.checked;
					});
				});
			});

			// 全解除ボタン
			document.getElementById('clearFilters')?.addEventListener('click', () => {
				document.querySelectorAll('#filterModal input[type="checkbox"]').forEach(cb => cb.checked = false);
			});
		});
	</script>
</body>

</html>
