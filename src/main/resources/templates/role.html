<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>ユーザー権限管理</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* CSSはstyle.cssに統合済みだが、テーブル幅をここで固定 */
        table { width: 95%; margin: 20px auto; border-collapse: collapse; }
        .table-container { 
            max-height: 70vh; /* 画面の高さに応じてスクロールできるように制限 */
            overflow-y: auto; 
            width: 95%; 
            margin: auto;
        }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; vertical-align: middle; font-size: 0.9em; }
        .search-indicator { width: 95%; margin: auto; text-align: right; color: #888; padding-right: 10px; }
        .pagination-controls { margin-top: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>
    
    <div class="container mt-4" style="max-width: 1200px;">
        <h1>ユーザー権限管理</h1>

        <form method="get" th:action="@{/admin/roles}" class="mb-4 d-flex justify-content-between">
            <div class="input-group" style="width: 350px;">
                <input type="text" class="form-control" placeholder="IDまたは氏名で検索" 
                       name="search" th:value="${searchQuery}" />
                <button class="btn btn-primary" type="submit">検索</button>
            </div>
             <div class="search-indicator">
                <span th:if="${searchQuery != null and searchQuery.length() > 0}" th:text="|'${searchQuery}' の検索結果 (${totalElements}件)|"></span>
            </div>
        </form>

        <div class="d-flex justify-content-center pagination-controls">
            <nav th:if="${totalElements > 0}">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/admin/roles(page=${currentPage - 1}, search=${searchQuery})}">前へ</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == i ? 'active' : ''}" 
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                        <a class="page-link" th:href="@{/admin/roles(page=${i}, search=${searchQuery})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/admin/roles(page=${currentPage + 1}, search=${searchQuery})}">次へ</a>
                    </li>
                </ul>
            </nav>
        </div>
        <form th:action="@{/admin/roles/save}" method="post">
            <div class="table-container">
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr class="table-secondary sticky-top"> <th>ユーザーID</th>
                            <th>氏名</th>
                            <th>部署</th> <th>所属グループ</th> <th>承認者</th>
                            <th>管理者</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${userPage}"> 
                            <td th:text="${user.userId}">user001</td>
                            <td th:text="${user.lastName} + ' ' + ${user.firstName}">山田 太郎</td>
                            <td th:text="${user.departmentName}">開発本部</td> <td th:text="${user.groupName}">システム開発1課</td> <td>
                                <div class="form-check form-switch">
                                    <input type="checkbox" class="form-check-input" th:id="|approverSwitch-${user.userId}|" name="approverStatus" th:value="${user.userId}" th:checked="${user.isApprover}" />
                                    <label class="form-check-label" th:for="|approverSwitch-${user.userId}|" th:text="${user.isApprover ? '承認者' : '一般'}"></label>
                                </div>
                            </td>
                            
                            <td>
                                <div class="form-check form-switch">
                                    <input type="checkbox" class="form-check-input" th:id="|adminSwitch-${user.userId}|" name="adminStatus" th:value="${user.userId}" onclick="openConfirmModal(this.form.id, this.checked, this)" th:checked="${user.isAdmin}" />
                                    <label class="form-check-label" th:for="|adminSwitch-${user.userId}|" th:text="${user.isAdmin ? '管理者' : '一般'}"></label>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <button type="submit" class="btn btn-success mt-3 me-3">変更を保存</button>
            <a th:href="@{/admin}" class="btn btn-secondary mt-3">キャンセルして戻る</a>
            
        </form>
    </div>

    </body>
</html>
