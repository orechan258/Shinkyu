<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>プロフィール申請管理 - 管理者</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .change-arrow { color: #aaa; margin: 0 10px; font-weight: bold; }
        .new-value { color: #d9534f; font-weight: bold; background-color: #fff4f4; padding: 2px 6px; border-radius: 4px; border: 1px solid #f8d7da; }
        .old-value { color: #888; text-decoration: line-through; font-size: 0.85em; }
        .no-change { color: #333; font-size: 0.95em; }
        .diff-container { display: flex; align-items: center; }
    </style>
</head>
<div th:replace="~{common :: menu}"></div>
<script th:replace="~{common :: menuScript}"></script>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 1100px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>プロフィール変更申請 承認</h1>
            <a th:href="@{/admin}" class="btn btn-outline-secondary">管理者メニューに戻る</a>
        </div>

        <div th:if="${message}" class="alert alert-info shadow-sm" th:text="${message}"></div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 12%;">申請者ID</th>
                            <th style="width: 18%;">申請日時</th>
                            <th style="width: 25%;">氏名の変更内容</th>
                            <th style="width: 25%;">所属の変更内容</th>
                            <th style="width: 20%;" class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="req : ${pendingRequests}">
                            <td th:text="${req.userId}" class="fw-bold text-primary"></td>
                            <td th:text="${#temporals.format(req.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
                            
                            <td>
                                <div th:if="${req.currentLastName != req.newLastName or req.currentFirstName != req.newFirstName}" class="diff-container">
                                    <span class="old-value" th:text="${req.currentLastName} + ' ' + ${req.currentFirstName}"></span>
                                    <span class="change-arrow">➔</span>
                                    <span class="new-value" th:text="${req.newLastName} + ' ' + ${req.newFirstName}"></span>
                                </div>
                                <div th:unless="${req.currentLastName != req.newLastName or req.currentFirstName != req.newFirstName}" class="no-change">
                                    <span th:text="${req.currentLastName} + ' ' + ${req.currentFirstName}"></span>
                                    <small class="text-muted ms-2">(変更なし)</small>
                                </div>
                            </td>

                            <td>
                                <div th:if="${req.currentGroupName != req.newGroupName}" class="diff-container">
                                    <span class="old-value" th:text="${req.currentGroupName}"></span>
                                    <span class="change-arrow">➔</span>
                                    <span class="new-value" th:text="${req.newGroupName}"></span>
                                </div>
                                <div th:unless="${req.currentGroupName != req.newGroupName}" class="no-change">
                                    <span th:text="${req.currentGroupName}"></span>
                                    <small class="text-muted ms-2">(変更なし)</small>
                                </div>
                            </td>

                            <td class="text-center">
                                <form th:action="@{/admin/approve-profile-request}" method="post">
                                    <input type="hidden" name="requestId" th:value="${req.requestId}">
                                    <div class="btn-group">
                                        <button type="submit" name="approved" value="true" class="btn btn-success px-3" onclick="return confirm('この内容でユーザー情報を更新しますか？')">承認</button>
                                        <button type="submit" name="approved" value="false" class="btn btn-outline-danger" onclick="return confirm('この申請を却下しますか？')">却下</button>
                                    </div>
                                </form>
                            </td>
                        </tr>
                        
                        <tr th:if="${#lists.isEmpty(pendingRequests)}">
                            <td colspan="5" class="text-center py-5 text-muted bg-white">
                                <i class="bi bi-info-circle me-2"></i>現在、未処理のプロフィール変更申請はありません。
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
