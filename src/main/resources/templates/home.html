<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>在宅勤務申請システム</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
    
    <div class="user-info" sec:authorize="isAuthenticated()">
	    <span>ログイン中: </span>
	    <a th:href="@{/profile}" th:text="${userName}"></a>
	</div>
	
	<div th:replace="~{common :: menu}"></div>
<script th:replace="~{common :: menuScript}"></script>
    <h1>在宅勤務申請システム</h1>
    
    <div class="button-container">
        
        <a th:href="@{/request}" class="main-button" sec:authorize="isAuthenticated()">申請画面</a>
        
        <a th:href="@{/check}" class="main-button" sec:authorize="isAuthenticated()">申請確認画面</a>
        
        <a th:href="@{/approve}" class="main-button" sec:authorize="hasAnyRole('APPROVER', 'ADMIN')">承認画面</a>
        
        <a th:href="@{/admin}" class="main-button" sec:authorize="hasRole('ADMIN')">管理者画面</a>
        
        <hr style="width: 100%; border-top: 1px solid #ccc; margin: 10px 0;">
        
        <form th:action="@{/logout}" method="post" style="display: block;">
            <button type="submit" class="main-button" style="background-color: #dc3545; border-color: #dc3545;">ログアウト</button>
        </form>
    </div>
    
    <script>
	    function toggleMenu() {
	        const menu = document.getElementById('menuPanel');
	        menu.classList.toggle('open');
	    }
	</script>
    </body>
</html>
