<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン画面</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); width: 300px; }
        h1 { text-align: center; color: #333; }

        /* --- フォームと入力欄の既存スタイル --- */
        input[type="text"] { width: 100%; padding: 10px; margin: 8px 0 16px 0; display: inline-block; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #5cb85c; color: white; padding: 14px 20px; margin: 8px 0; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        .error { color: red; text-align: center; margin-bottom: 10px; }

        /* --- パスワード入力欄の修正スタイル --- */
        .password-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        .password-wrapper input[type="password"],
        .password-wrapper input[type="text"] { 
            width: 100%;
            padding: 10px;
            padding-right: 40px; /* アイコン分のスペース */
            margin: 8px 0 0 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        /* ★位置とスタイルの修正 */
        .toggle-icon {
            position: absolute;
            top: 50%; /* 親要素(Wrapper)の中央に */
            right: 12px;
            /* Wrapper内の input のマージンとパディングを考慮して調整 */
            transform: translateY(calc(-50% + 4px)); 
            cursor: pointer;
            color: #888; /* 落ち着いたグレー */
            font-size: 1.1em;
            transition: opacity 0.1s;
        }
        /* ★ホバー効果の修正：カーソルが乗ったら、不透明度を下げて白っぽく見せる */
        .toggle-icon:hover {
             opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>システム ログイン</h1>

        <div th:if="${param.error}" class="error">
            ユーザーIDまたはパスワードが正しくありません。
        </div>

        <form th:action="@{/login}" method="post">
            
            <label for="userId"><b>ユーザーID</b></label>
            <input type="text" placeholder="ユーザーIDを入力" id="userId" name="userId" required>

            <label for="password"><b>パスワード</b></label>
            <div class="password-wrapper">
                <input type="password" placeholder="パスワードを入力" id="password" name="password" required>
                
                <i id="toggleIcon" class="toggle-icon fas fa-eye" onclick="togglePassword()"></i>
            </div>

            <button type="submit">ログイン</button>
        </form>
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                // 表示状態: fa-eye から fa-eye-slash に変更
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordField.type = 'password';
                // 非表示状態: fa-eye-slash から fa-eye に変更
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>

</body>
</html>
