<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>承認一覧</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 8px; }
        .special { background-color: #ffe0b2; } /* 特認行の強調 */
    </style>
</head>
<body>
    <h1>申請承認管理画面</h1>

    <h2>1. 承認待ちの申請</h2>
    <table>
        <thead>
            <tr>
                <th>特認</th> 
                <th>ユーザーID</th>
                <th>開始日時</th>
                <th>終了日時</th>
                <th>理由</th>
                <th>半日</th>
                <th>アクション</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="req : ${pendingRequests}" 
                th:class="${req.spApply != null and req.spApply ? 'special' : ''}">
                
                <td><span th:if="${req.spApply != null and req.spApply}">✅</span></td>
                
                <td th:text="${req.userId}">U001</td> 
                <td th:text="${req.startDate} + ' ' + ${req.startTime}">2025-01-01 09:00:00</td>
                <td th:text="${req.endDate} + ' ' + ${req.endTime}">2025-01-01 17:30:00</td>
                <td th:text="${req.reason}">私用</td>
                <td th:text="${req.halfDay == null ? 'N/A' : (req.halfDay ? '　〇　' : '　')}">いいえ</td>

                <td>
				    <form th:action="@{/approve/action}" method="post" style="display:inline;">
				        <input type="hidden" name="requestId" th:value="${req.requestId}" /> 
				        <button type="submit" name="action" value="approve">承認</button>
				    </form>
				    
				    <form th:action="@{/approve/action}" method="post" style="display:inline;">
				        <input type="hidden" name="requestId" th:value="${req.requestId}" />
				        <button type="submit" name="action" value="reject">拒否</button>
				    </form>
				</td>
            </tr>
        </tbody>
    </table>

    <h2 style="margin-top: 30px;">2. 承認済みの申請</h2>
    <table>
        <thead>
            <tr>
                <th>特認</th>
                <th>ユーザーID</th>
                <th>開始日時</th>
                <th>終了日時</th>
                <th>理由</th>
                <th>半日</th>
                <th>ステータス</th>
            </tr>
        </thead>
        <tbody>
           <tr th:each="req : ${approvedRequests}" 
               th:class="${req.spApply != null and req.spApply ? 'special' : ''}">
                <td><span th:if="${req.spApply != null and req.spApply}">✅</span></td>
                
                <td th:text="${req.userId}">U002</td> 
                <td th:text="${req.startDate} + ' ' + ${req.startTime}">2025-01-02 09:00:00</td>
                <td th:text="${req.endDate} + ' ' + ${req.endTime}">2025-01-02 17:30:00</td>
                <td th:text="${req.reason}">体調不良</td>
                <td th:text="${req.halfDay == null ? 'N/A' : (req.halfDay ? '　〇　' : '　')}">いいえ</td>
                
                <td>
				    <span th:if="${req.apply == null or req.apply == 0}">未確認</span>
				    <span th:if="${req.apply == 2}">拒否</span>
				    <span th:if="${req.apply == 1}">承認</span>
				</td>
            </tr>
        </tbody>
    </table>
    
    <a th:href="@{/home}">ホーム画面に戻る</a>

</body>
</html>
