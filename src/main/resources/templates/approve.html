<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>申請承認管理画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <style>
        /* --- タブメニューの基本スタイル --- */
        .tab-menu {
            display: flex;
            border-bottom: 2px solid #ccc;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #ddd;
            border: 1px solid #ccc;
            border-bottom: none;
            margin-right: 5px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            transition: background-color 0.2s;
            font-weight: bold;
        }

        .tab-button.active {
            background-color: #f8f9fa;
            border-color: #ccc;
            border-bottom: 2px solid #f8f9fa;
            margin-bottom: -2px;
            color: #3498db;
        }

        .tab-content {
            display: none;
            padding: 10px 0;
            border-top: 2px solid #ccc;
            margin-top: -2px;
        }

        .tab-content.active {
            display: block;
        }

        /* --- テーブル固有のスタイル --- */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        thead {
            background-color: #34495e;
            color: white;
        }

        .special {
            background-color: #ffe0b2;
        }

        /* 特認行の強調 */
        .expired {
            background-color: #fdd;
        }

        /* 期限切れを赤で強調 */
        .rejected {
            color: red;
            font-weight: bold;
        }

        /* 拒否された申請を強調 */
    </style>
</head>

<body>

    <div th:replace="~{common :: menu}"></div>
    <script th:replace="~{common :: menuScript}"></script>

    <h1>申請承認管理画面</h1>

    <!-- エラー・成功メッセージ表示 -->
    <div th:if="${error}" class="alert alert-danger"
        style="background-color: #f8d7da; color: #721c24; padding: 12px; margin: 15px 0; border: 1px solid #f5c6cb; border-radius: 4px;">
        <strong>エラー:</strong> <span th:text="${error}"></span>
    </div>
    <div th:if="${message}" class="alert alert-success"
        style="background-color: #d4edda; color: #155724; padding: 12px; margin: 15px 0; border: 1px solid #c3e6cb; border-radius: 4px;">
        <strong>成功:</strong> <span th:text="${message}"></span>
    </div>

    <div class="tab-menu">
        <button class="tab-button active" onclick="openTab(event, 'pending')">承認待ち</button>
        <button class="tab-button" onclick="openTab(event, 'completed')">確認済み (承認/拒否)</button>
        <button class="tab-button" onclick="openTab(event, 'expired')">期限切れ</button>
    </div>

    <div id="pending" class="tab-content active">
        <h2>承認待ちの申請 (<span th:text="${pendingRequests.size()}">0</span>件)</h2>
        <table th:if="${!pendingRequests.empty}">
            <thead>
                <tr>
                    <th>特認</th>
                    <th>申請者氏名</th>
                    <th>開始日時</th>
                    <th>終了日時</th>
                    <th>理由</th>
                    <th>半日</th>
                    <th>アクション</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="req : ${pendingRequests}"
                    th:class="${req.spApply != null and req.spApply ? 'special' : ''}">

                    <td><span th:if="${req.spApply != null and req.spApply}">✅</span></td>
                    <td th:text="${req.applicantFullName}"></td>
                    <td th:text="${req.startDate} + ' ' + ${req.startTime}"></td>
                    <td th:text="${req.endDate} + ' ' + ${req.endTime}"></td>
                    <td th:text="${req.reason}"></td>
                    <td th:text="${req.halfDay == null ? 'N/A' : (req.halfDay ? '　〇　' : '　')}"></td>

                    <td>
                        <form th:action="@{/approve/action}" method="post" style="display:inline;">
                            <input type="hidden" name="requestId" th:value="${req.requestId}" /> <button type="submit"
                                name="action" value="approve">承認</button>
                        </form>

                        <form th:action="@{/approve/action}" method="post" style="display:inline;">
                            <input type="hidden" name="requestId" th:value="${req.requestId}" />
                            <button type="submit" name="action" value="reject">拒否</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${pendingRequests.empty}">承認待ちの申請はありません。</div>
    </div>

    <div id="completed" class="tab-content">
        <h2>確認済みの申請 (<span th:text="${approvedRequests.size()}">0</span>件)</h2>
        <table th:if="${!approvedRequests.empty}">
            <thead>
                <tr>
                    <th>特認</th>
                    <th>申請者氏名</th>
                    <th>開始日時</th>
                    <th>終了日時</th>
                    <th>理由</th>
                    <th>半日</th>
                    <th>ステータス</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="req : ${approvedRequests}"
                    th:classappend="${req.spApply != null and req.spApply ? 'special' : ''} + ' ' + (${req.apply == 2} ? 'rejected' : '')">

                    <td><span th:if="${req.spApply != null and req.spApply}">✅</span></td>
                    <td th:text="${req.applicantFullName}"></td>
                    <td th:text="${req.startDate} + ' ' + ${req.startTime}"></td>
                    <td th:text="${req.endDate} + ' ' + ${req.endTime}"></td>
                    <td th:text="${req.reason}"></td>
                    <td th:text="${req.halfDay == null ? 'N/A' : (req.halfDay ? '　〇　' : '　')}"></td>

                    <td>
                        <span th:if="${req.apply == 2}" style="color: red;">❌ 拒否</span>
                        <span th:if="${req.apply == 1}" style="color: green;">✅ 承認</span>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${approvedRequests.empty}">確認済みの申請はありません。</div>
    </div>

    <div id="expired" class="tab-content">
        <h2>期限切れの申請 (<span th:text="${expiredRequests.size()}">0</span>件)</h2>
        <table th:if="${!expiredRequests.empty}">
            <thead>
                <tr>
                    <th>特認</th>
                    <th>申請者氏名</th>
                    <th>開始日時</th>
                    <th>終了日時</th>
                    <th>理由</th>
                    <th>半日</th>
                    <th>ステータス</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="req : ${expiredRequests}" class="expired">
                    <td><span th:if="${req.spApply != null and req.spApply}">✅</span></td>

                    <td th:text="${req.applicantFullName}"></td>
                    <td th:text="${req.startDate} + ' ' + ${req.startTime}"></td>
                    <td th:text="${req.endDate} + ' ' + ${req.endTime}"></td>
                    <td th:text="${req.reason}"></td>
                    <td th:text="${req.halfDay == null ? 'N/A' : (req.halfDay ? '　〇　' : '　')}"></td>
                    <td><span style="color: orange;">⚠️ 期限切れ</span></td>
                </tr>
            </tbody>
        </table>
        <div th:if="${expiredRequests.empty}">期限切れの申請はありません。</div>
    </div>

    <script>
        // ハンバーガーメニューのトグル (削除)

        // タブ切り替えのJavaScript
        function openTab(evt, tabName) {
            let i, tabcontent, tablinks;

            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }

            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }

            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>

</html>
