<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ユーザー情報編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .application-form {
            /* style.cssで制御するため削除または最小限に */
            margin: 50px auto;
            width: 100%;
            max-width: 600px;
        }

        .display-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #ddd;
            margin-bottom: 10px;
        }

        .form-label {
            font-weight: bold;
            color: #555;
            display: block;
            font-size: 0.85rem;
        }

        .display-value {
            font-size: 1rem;
            color: #333;
        }

        .edit-icon {
            cursor: pointer;
            color: #5cb85c;
            font-size: 1.2rem;
        }

        .edit-icon:hover {
            color: #4cae4c;
        }

        .validation-message p {
            margin: 2px 0;
            font-size: 0.9em;
        }

        .valid {
            color: green;
            font-weight: bold;
        }

        .invalid {
            color: red;
        }

        .input-group {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            z-index: 10;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <div th:replace="~{common :: menu}"></div>
    <script th:replace="~{common :: menuScript}"></script>
    <div class="application-form">
        <h1>ユーザー情報</h1>

        <div th:if="${param.success}" class="alert alert-success py-2 small">
            <span th:if="${param.success[0] == 'password'}">パスワードを更新しました。</span>
            <span th:if="${param.success[0] == 'application'}">変更申請を承りました。</span>
        </div>
        <div th:if="${success == 'google_unlinked'}" class="alert alert-warning py-2 small">Google連携を解除しました。</div>
        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

        <div class="display-row">
            <div class="display-content">
                <span class="form-label">ユーザーID</span>
                <span class="display-value" th:text="${user.userId}">U12345</span>
            </div>
        </div>

        <div class="display-row">
            <div class="display-content">
                <span class="form-label">Google連携状態</span>
                <span class="display-value">
                    <span th:if="${user.email != null}">
                        <i class="bi bi-google text-primary"></i>
                        <span th:text="${user.maskedEmail}">Sa***@gmail.com</span>
                    </span>
                    <span th:unless="${user.email != null}">
                        <span class="text-muted me-2">未連携</span>
                        <a th:href="@{/profile/link-google-start}" class="btn btn-outline-primary btn-sm py-0">連携する</a>
                    </span>
                </span>
            </div>
            <form th:if="${user.email != null}" th:action="@{/profile/unlink-google}" method="post"
                onsubmit="return confirm('Google連携を解除しますか？')">
                <button type="submit" class="btn btn-outline-danger btn-sm py-0">解除</button>
            </form>
        </div>

        <div class="display-row">
            <div class="display-content">
                <span class="form-label">氏名</span>
                <span class="display-value" th:text="${user.lastName} + ' ' + ${user.firstName}">山田 太郎</span>
            </div>
            <i class="bi bi-pencil edit-icon" data-bs-toggle="modal" data-bs-target="#nameEditModal"></i>
        </div>

        <div class="display-row">
            <div class="display-content">
                <span class="form-label">所属部署 / グループ</span>
                <span class="display-value" th:text="${user.departmentName} + ' / ' + ${user.groupName}">部署名</span>
            </div>
            <i class="bi bi-pencil edit-icon" data-bs-toggle="modal" data-bs-target="#deptEditModal"></i>
        </div>

        <div class="display-row">
            <div class="display-content">
                <span class="form-label">パスワード</span>
                <span class="display-value" id="maskedPasswordDisplay">**********</span>
            </div>
            <i class="bi bi-pencil edit-icon" data-bs-toggle="modal" data-bs-target="#passwordModal"></i>
        </div>


    </div>

    <div class="modal fade" id="nameEditModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/profile/application}" method="post">
                    <div class="modal-header bg-warning">
                        <h5 class="modal-title">氏名変更の申請</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" th:value="${user.userId}" name="userId" />
                        <input type="hidden" th:value="${user.groupId}" name="newGroupId" />
                        <div class="row">
                            <div class="col">
                                <label class="form-label">姓</label>
                                <input type="text" class="form-control" name="newLastName" th:value="${user.lastName}"
                                    required>
                            </div>
                            <div class="col">
                                <label class="form-label">名</label>
                                <input type="text" class="form-control" name="newFirstName" th:value="${user.firstName}"
                                    required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-warning text-dark">氏名変更を申請</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deptEditModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/profile/application}" method="post">
                    <div class="modal-header bg-warning">
                        <h5 class="modal-title">所属部署・グループ変更の申請</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" th:value="${user.userId}" name="userId" />
                        <input type="hidden" th:value="${user.lastName}" name="newLastName" />
                        <input type="hidden" th:value="${user.firstName}" name="newFirstName" />
                        <div class="mb-3">
                            <label class="form-label">新しい所属先（グループ名）</label>
                            <select name="newGroupId" class="form-select">
                                <option th:value="${user.groupId}" th:text="${user.groupName} + ' (変更なし)'" selected>
                                </option>
                                <option th:each="g : ${allGroups}" th:value="${g.id}"
                                    th:text="${g.department.name} + ' / ' + ${g.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-warning text-dark">部署変更を申請</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="passwordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/profile/password}" method="post">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">パスワードの変更</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" th:value="${user.userId}" name="userId" />
                        <label class="form-label">現在のパスワード</label>
                        <div class="input-group mb-3">
                            <input type="password" class="form-control" id="current-password" name="currentPassword"
                                required>
                            <i class="bi bi-eye-slash toggle-password" data-target="current-password"
                                onclick="togglePasswordVisibility(this)"></i>
                        </div>
                        <label class="form-label">新しいパスワード</label>
                        <div class="input-group mb-2">
                            <input type="password" class="form-control" id="new-password" name="newPassword" required>
                            <i class="bi bi-eye-slash toggle-password" data-target="new-password"
                                onclick="togglePasswordVisibility(this)"></i>
                        </div>
                        <div id="validation-messages" class="validation-message">
                            <p id="len-check" class="invalid">最低8文字以上</p>
                            <p id="upper-check" class="invalid">大文字 (A-Z) を含む</p>
                            <p id="lower-check" class="invalid">小文字 (a-z) を含む</p>
                            <p id="symbol-check" class="invalid">記号 (@!#$など) を含む</p>
                            <p id="match-check" class="invalid">確認用パスワードと一致</p>
                        </div>
                        <label class="form-label mt-3">確認用</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirm-password" required>
                            <i class="bi bi-eye-slash toggle-password" data-target="confirm-password"
                                onclick="togglePasswordVisibility(this)"></i>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" id="submit-password" class="btn btn-primary" disabled>変更を保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            attachPasswordListeners();
        });

        function checkPasswordClientSide() {
            const newPwd = document.getElementById('new-password').value;
            const confirmPwd = document.getElementById('confirm-password').value;
            const checks = {
                'len-check': newPwd.length >= 8,
                'upper-check': /[A-Z]/.test(newPwd),
                'lower-check': /[a-z]/.test(newPwd),
                'symbol-check': /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(newPwd),
                'match-check': (newPwd === confirmPwd) && (confirmPwd !== '')
            };
            for (const id in checks) {
                const el = document.getElementById(id);
                if (el) el.className = checks[id] ? 'valid' : 'invalid';
            }
            document.getElementById('submit-password').disabled = !Object.values(checks).every(v => v);
        }

        function attachPasswordListeners() {
            const n = document.getElementById('new-password');
            const c = document.getElementById('confirm-password');
            if (n && c) {
                n.addEventListener('input', checkPasswordClientSide);
                c.addEventListener('input', checkPasswordClientSide);
            }
        }

        function togglePasswordVisibility(icon) {
            const input = document.getElementById(icon.getAttribute('data-target'));
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.classList.toggle('bi-eye-slash');
            icon.classList.toggle('bi-eye');
        }
    </script>
</body>

</html>
