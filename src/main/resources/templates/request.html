<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在宅勤務申請</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">

    <style>
        /* request.html 固有の調整スタイル */
        /* request.html 固有の調整スタイル */
        .application-form {
            /* style.cssの設定に従う（背景透明・影なし） */
            margin-top: 30px;
        }

        /* Submitボタンを共通の緑系にする */
        .submit-button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;

            /* ★メインボタンの色を使用 (style.cssに依存) */
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        .submit-button:hover {
            background-color: #449d44;
        }

        /* フォーム内パーツのレイアウト (flex, gapは維持) */
        .datetime-group {
            display: flex;
            gap: 10px;
        }

        .datetime-group input {
            width: 50%;
        }

        /* ... (その他のフォーム固有スタイルはstyle.cssから適用されるか、そのまま維持) ... */
    </style>
</head>

<body>

    <div th:replace="~{common :: menu}"></div>
    <script th:replace="~{common :: menuScript}"></script>
    <div class="application-form">
        <h1>在宅勤務申請フォーム</h1>

        <!-- エラーメッセージ表示 -->
        <div th:if="${error}" class="alert alert-danger"
            style="background-color: #f8d7da; color: #721c24; padding: 12px; margin: 15px 0; border: 1px solid #f5c6cb; border-radius: 4px;">
            <strong>エラー:</strong> <span th:text="${error}"></span>
        </div>

        <!-- 警告メッセージ表示 (上限超過時) -->
        <div th:if="${warning}" class="alert alert-warning"
            style="background-color: #fff3cd; color: #856404; padding: 12px; margin: 15px 0; border: 1px solid #ffeeba; border-radius: 4px;">
            <strong>注意:</strong> <span th:text="${warning}"></span>
        </div>

        <form th:action="@{/request}" method="post" th:object="${request}">

            <input type="hidden" th:field="*{requestId}" />

            <fieldset class="form-group">
                <legend>勤務日時</legend>

                <div class="form-group">
                    <label for="startDate">開始日時</label>
                    <div class="datetime-group">
                        <input type="date" id="startDate" th:field="*{startDate}" class="form-control" required>
                        <input type="time" id="startTime" th:field="*{startTime}" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="endTime">終了時間</label>
                    <div class="datetime-group">
                        <!-- 終了日は開始日と同じになるため入力不要 -->
                        <input type="time" id="endTime" th:field="*{endTime}" class="form-control" required>
                    </div>
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>申請情報</legend>
                <div class="form-group">
                    <label for="reason">申請理由</label>
                    <textarea id="reason" th:field="*{reason}" class="form-control" placeholder="例：集中して作業を進めるため"
                        required></textarea>
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>オプション</legend>
                <div class="checkbox-container">

                    <label for="halfDay">
                        <input type="checkbox" id="halfDay" th:field="*{halfDay}" class="form-check-input">
                        半日勤務
                    </label>

                    <label for="spApply" class="special-approval-label">
                        <input type="checkbox" id="spApply" th:field="*{spApply}" class="form-check-input">
                        特認申請
                    </label>
                </div>
            </fieldset>

            <fieldset class="form-group" th:if="${needsConfirmation}">
                <legend style="color: #856404;">追加確認</legend>
                <div class="checkbox-container"
                    style="background-color: #fff3cd; padding: 10px; border-radius: 8px; border: 1px solid #ffeeba;">
                    <label for="confirmed" style="color: #856404; font-weight: bold;">
                        <input type="checkbox" id="confirmed" name="confirmed" class="form-check-input" required>
                        所属長に相談済みです
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="submit-button"
                th:text="${needsConfirmation} ? '重要事項を確認して申請する' : 'この内容で申請する'">この内容で申請する</button>

        </form>
    </div>



    <script>


        // ページ読み込み時に実行
        document.addEventListener('DOMContentLoaded', function () {
            const startDateInput = document.getElementById('startDate');

            // 今日の日付をYYYY-MM-DD形式で取得
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;

            // 開始日のmin属性に今日の日付を設定（過去日選択不可）
            startDateInput.setAttribute('min', todayStr);
            if (!startDateInput.value) startDateInput.value = todayStr;

            // 時間のデフォルト値を設定 (値が空の場合のみ)
            const startTimeInput = document.getElementById('startTime');
            const endTimeInput = document.getElementById('endTime');
            if (!startTimeInput.value) startTimeInput.value = "09:00";
            if (!endTimeInput.value) endTimeInput.value = "18:00";
        });
    </script>
</body>

</html>
