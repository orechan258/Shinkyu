<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在宅勤務申請</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* request.html 固有の調整スタイル */
        .application-form {
            /* 共通CSSの幅とデザインを使用 */
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            margin-top: 30px; /* メニューアイコンとのスペース */
        }
        
        /* Submitボタンを共通の緑系にする */
        .submit-button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            
            /* ★メインボタンの色を使用 (style.cssに依存) */
            background-color: #5cb85c; 
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }
        .submit-button:hover {
            background-color: #449d44;
        }

        /* フォーム内パーツのレイアウト (flex, gapは維持) */
        .datetime-group { display: flex; gap: 10px; }
        .datetime-group input { width: 50%; }
        /* ... (その他のフォーム固有スタイルはstyle.cssから適用されるか、そのまま維持) ... */
    </style>
</head>
<body>

    <div class="hamburger-menu">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div id="menuPanel" class="menu-panel">
            <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">×</a>
            <a th:href="@{/profile}" sec:authorize="isAuthenticated()">プロフィール</a>
            <a th:href="@{/request}" sec:authorize="isAuthenticated()">申請画面</a>
            <a th:href="@{/check}" sec:authorize="isAuthenticated()">申請確認画面</a>
            <a th:href="@{/approve}" sec:authorize="hasAnyRole('APPROVER', 'ADMIN')">承認画面</a>
            <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">管理者画面</a>
            <a th:href="@{/home}">ホームへ戻る</a>
            <form th:action="@{/logout}" method="post" style="padding: 15px 20px;">
                <button type="submit" style="width: 100%; background-color: #e74c3c; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer;">ログアウト</button>
            </form>
        </div>
    </div>
    <div class="application-form">
        <h1>在宅勤務申請フォーム</h1>
        
        <form th:action="@{/request}" method="post" th:object="${request}">
            
            <input type="hidden" th:field="*{requestId}" />

            <fieldset class="form-group">
                <legend>勤務日時</legend>
                
                <div class="form-group">
                    <label for="startDate">開始日時</label>
                    <div class="datetime-group">
                        <input type="date" id="startDate" th:field="*{startDate}" class="form-control" required>
                        <input type="time" id="startTime" th:field="*{startTime}" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="endDate">終了日時</label>
                    <div class="datetime-group">
                        <input type="date" id="endDate" th:field="*{endDate}" class="form-control" required>
                        <input type="time" id="endTime" th:field="*{endTime}" class="form-control" required>
                    </div>
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>申請情報</legend>
                <div class="form-group">
                    <label for="reason">申請理由</label>
                    <textarea id="reason" th:field="*{reason}" class="form-control" placeholder="例：集中して作業を進めるため" required></textarea>
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>オプション</legend>
                <div class="checkbox-container">
                    
                    <label for="halfDay">
                        <input type="checkbox" id="halfDay" th:field="*{halfDay}" class="form-check-input">
                        半日勤務
                    </label>
                    
                    <label for="spApply" class="special-approval-label">
                        <input type="checkbox" id="spApply" th:field="*{spApply}" class="form-check-input">
                        特認申請
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="submit-button">この内容で申請する</button>

        </form>
    </div>

    <div class="back-link-container">
        <a th:href="@{/home}" class="back-link">ホーム画面に戻る</a>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menuPanel');
            menu.classList.toggle('open');
        }
    </script>
</body>
</html>
