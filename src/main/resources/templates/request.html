<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在宅勤務申請</title>
    <style>
        /* CSSは変更なし！ */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            /* columnに変更し、フォームとリンクを縦に並べる */
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            margin: 0;
        }
        .application-form {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        /* fieldsetのデフォルトスタイルをリセット */
        fieldset {
            border: none;
            padding: 0;
            margin: 0;
        }
        legend {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding: 0;
            width: 100%;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        /* 入力フィールドを分割し、Entityの型(LocalDate/LocalTime)に合わせる */
        .datetime-group {
            display: flex;
            gap: 10px;
        }
        .datetime-group input {
            width: 50%; /* 2つのフィールドを横並びにする */
        }
        input[type="date"], input[type="time"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .checkbox-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 0;
            margin-top: 10px; /* 上の間隔を調整 */
        }
        .checkbox-container legend { 
            border: none;
            margin-bottom: 0;
            font-size: 1em;
            font-weight: normal;
            color: #555;
            text-align: center;
        }
        .checkbox-container label {
            margin-bottom: 0;
            font-weight: normal;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .checkbox-container input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        .special-approval-label {
            font-weight: bold;
            color: #dc3545;
        }
        .submit-button {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px; /* 上の間隔を調整 */
        }
        .submit-button:hover {
            background-color: #0056b3;
        }
        
        /* ★追加: 戻るボタンのスタイルを調整 */
        .back-link-container {
            width: 100%;
            max-width: 450px; /* フォームと同じ幅に揃える */
            margin-top: 15px; /* フォームとの間隔 */
        }
        .back-link {
            display: block;
            text-align: center;
            padding: 12px;
            background-color: #6c757d; /* グレー系で目立たなくする */
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .back-link:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="application-form">
        <h1>在宅勤務申請フォーム</h1>
        <form th:action="@{/request}" method="post" th:object="${request}">
            
            <input type="hidden" th:field="*{requestId}" />

            <fieldset class="form-group">
                <legend>勤務日時</legend>
                
                <div class="form-group">
                    <label for="startDate">開始日時</label>
                    <div class="datetime-group">
                        <input type="date" id="startDate" th:field="*{startDate}" required>
                        <input type="time" id="startTime" th:field="*{startTime}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="endDate">終了日時</label>
                    <div class="datetime-group">
                        <input type="date" id="endDate" th:field="*{endDate}" required>
                        <input type="time" id="endTime" th:field="*{endTime}" required>
                    </div>
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>申請情報</legend>
                <div class="form-group">
                    <label for="reason">申請理由</label>
                    <textarea id="reason" th:field="*{reason}" placeholder="例：集中して作業を進めるため" required></textarea>
                </div>
            </fieldset>

            <fieldset class="form-group">
                <legend>オプション</legend>
                <div class="checkbox-container">
                    
                    <label for="halfDay">
                        <input type="checkbox" id="halfDay" th:field="*{halfDay}">
                        半日勤務
                    </label>
                    
                    <label for="spApply" class="special-approval-label">
                        <input type="checkbox" id="spApply" th:field="*{spApply}">
                        特認申請
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="submit-button">この内容で申請する</button>

        </form>
    </div>

    <div class="back-link-container">
        <a th:href="@{/home}" class="back-link">ホーム画面に戻る</a>
    </div>

</body>
</html>
