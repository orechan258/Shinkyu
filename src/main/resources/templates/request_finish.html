<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>申請完了</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .success-message { background-color: #e6ffe6; border: 1px solid #00cc00; padding: 20px; border-radius: 5px; max-width: 500px; margin: 0 auto; }
        h1 { color: #007bff; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    
    <div class="hamburger-menu">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div id="menuPanel" class="menu-panel">
            <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">×</a>
            
            <a th:href="@{/profile}" sec:authorize="isAuthenticated()">プロフィール</a>
            <a th:href="@{/request}" sec:authorize="isAuthenticated()">申請画面</a>
            <a th:href="@{/check}" sec:authorize="isAuthenticated()">申請確認画面</a>
            <a th:href="@{/approve}" sec:authorize="hasAnyRole('APPROVER', 'ADMIN')">承認画面</a>
            <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">管理者画面</a>
            <a th:href="@{/home}">ホームへ戻る</a>

            <form th:action="@{/logout}" method="post" style="padding: 15px 20px;">
                <button type="submit" style="width: 100%; background-color: #e74c3c; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer;">ログアウト</button>
            </form>
        </div>
    </div>
    <div class="success-message">
        <h1>✅ 申請が完了しました</h1>
        <p>リモートワークの申請を承りました。</p>
        <p>承認者の確認が完了するまでしばらくお待ちください。</p>
        
        <p style="margin-top: 25px;">
            <a th:href="@{/home}">ホーム画面に戻る</a>
        </p>
    </div>
    
    <script>
	    function toggleMenu() {
	        const menu = document.getElementById('menuPanel');
	        menu.classList.toggle('open');
	    }
	</script>
</body>
</html>
